<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Manager</title>
    <meta name="description" content="Punto de venta y gestión de repartos.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app"></div>

    <!-- Módulos Core -->
    <script src="scripts/core/Globals.js"></script>
    <script src="scripts/core/App.js"></script>
    
    <!-- Módulos Views -->
    <script src="scripts/views/View_Config.js"></script>
    <script src="scripts/views/View_Inventory.js"></script>
    <script src="scripts/views/View_POS.js"></script>
    
    <!-- Módulos Actions -->
    <script src="scripts/actions/Action_Inventory.js"></script>
    <script src="scripts/actions/Action_POS.js"></script>
    <script src="scripts/actions/Action_Printer.js"></script>
    
    <!-- Módulos Utils -->
    <script src="scripts/utils/ESCPOS.js"></script>
    
    <!-- Script Principal -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Actions && window.Actions.App_Init) {
                window.Actions.App_Init();
            }
        });
    </script>
</body>
</html>
